# Construit l'APK Android (l'appli web embarquée telle quelle, dossier android/) et le publie dans la release « apk »
# du dépôt, à chaque push sur la branche par défaut. C'est là que l'appli « Mes applis » le trouve.
# Lien permanent : https://github.com/p-bailly/Toc/releases/latest/download/toc.apk
name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    # Uniquement sur la branche par défaut du dépôt.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      # Même configuration Firebase que le site (voir deploy.yml) : sans elle, l'APK ne joue que contre l'IA.
      - name: Configuration Firebase
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: node outils/config-firebase.mjs
      # Le numéro de version vient de GITHUB_RUN_NUMBER (android/app/build.gradle) : il monte à chaque construction.
      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../toc.apk
      - name: Publication dans la release « apk »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK construit automatiquement depuis ${GITHUB_SHA::7} (build n°${GITHUB_RUN_NUMBER})."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk toc.apk --clobber
            gh release edit apk --title "Toc – APK Android" --notes "$NOTES" --latest
          else
            gh release create apk toc.apk --target "$GITHUB_SHA" --latest \
              --title "Toc – APK Android" --notes "$NOTES"
          fi
